name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Lint, tests and production build
        run: npm run check
      - name: Dependency audit
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build production image
        run: docker build --tag muvvital-agenda:${{ github.sha }} .
